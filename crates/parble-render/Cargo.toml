[package]
name = "parble-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
parble-sim = { path = "../parble-sim" }
# The builtin piece ids (`builtin_piece_ids!`), so the renderer embeds a GLB for every kit piece.
parble-kit = { path = "../parble-kit" }
# P1-T4 kit GLBs use EXT_meshopt_compression.
meshoptimizer-rs = { workspace = true }
serde = { workspace = true }
# hex-world's hex-render set without the UI and font features (the HUD is TypeScript, PRD §5.1).
bevy = { workspace = true, features = [
    "3d_bevy_render",
    "default_app",
    "std",
    "bevy_winit",
    "multi_threaded",
    # P1-T5 playroom textures: KTX2 with zstd supercompression (pure-Rust zstd builds for wasm32).
    "ktx2",
    "zstd_rust",
    # Fly-camera autofocus: one ray per frame against the visible meshes (camera::fly_focus_ray).
    "mesh_picking",
] }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["x11", "wayland"] }

# WebGPU only: no `webgl2` feature, so there is no WebGL fallback (index.html gates on navigator.gpu).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web", "webgpu"] }

[lints]
workspace = true
