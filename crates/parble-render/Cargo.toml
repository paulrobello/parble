[package]
name = "parble-render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
parble-sim = { path = "../parble-sim" }
serde = { workspace = true }
# hex-world's hex-render set without the UI and font features (the HUD is TypeScript, PRD §5.1).
bevy = { workspace = true, features = [
    "3d_bevy_render",
    "default_app",
    "std",
    "bevy_winit",
    "multi_threaded",
] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { workspace = true, features = ["x11", "wayland"] }

# WebGPU only: no `webgl2` feature, so there is no WebGL fallback (index.html gates on navigator.gpu).
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["web", "webgpu"] }

[lints]
workspace = true
