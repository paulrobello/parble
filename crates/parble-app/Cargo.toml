[package]
name = "parble-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "parble"
path = "src/main.rs"

[dependencies]
parble-core = { path = "../parble-core" }
parble-kit = { path = "../parble-kit" }
parble-render = { path = "../parble-render" }
parble-sim = { path = "../parble-sim" }
# `png`: --screenshot encodes the captured frame (a browser download on web).
bevy = { workspace = true, features = ["png"] }
serde = { workspace = true }
serde_json = { workspace = true }

# window.__parble and the URL query switches (P0-T6); the wasm Bridge (P0-T7).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }

[lints]
workspace = true
